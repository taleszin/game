<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer hexagon -->
  <polygon 
    points="50,5 93,27.5 93,72.5 50,95 7,72.5 7,27.5" 
    fill="none" 
    stroke="#00ffff" 
    stroke-width="2"
    filter="url(#glow)"
  />
  
  <!-- Inner triangle -->
  <polygon 
    points="50,25 75,65 25,65" 
    fill="none" 
    stroke="#ff00ff" 
    stroke-width="2"
    filter="url(#glow)"
  />
  
  <!-- Center circle -->
  <circle 
    cx="50" 
    cy="50" 
    r="10" 
    fill="#ffff00"
    filter="url(#glow)"
  />
</svg>
