<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>GEOMETRY CREATOR</title>
  </head>
  <body>
    <div id="game-container"></div>

    <div id="ui-layer">
      <div class="hud-top">
        <h1>GEOMETRY CREATOR</h1>
        <p>Status: PRE ALPHA</p>
      </div>
      
      <button id="btn-tree" class="round-btn" title="Genealogia">🌳</button>

      <div id="tree-modal" class="hidden">
          <div class="tree-header">
              <h2>REGISTRO DE VIDA</h2>
              <button id="btn-close-tree" class="close-btn">X</button>
          </div>
          <div id="tree-content">
              </div>
      </div>
      
      <div id="creation-panel" class="hidden">
        <div class="slots-container">
            <div class="slot active" id="slot-forma" data-target="forma">
                <div class="slot-label">1. FORMA</div>
                <div class="slot-icon">?</div>
                <div class="slot-name">Selecione</div>
            </div>
            <div class="arrow">➜</div>
            <div class="slot" id="slot-chem" data-target="quimica">
                <div class="slot-label">2. ESTRUTURA</div>
                <div class="slot-icon">?</div>
                <div class="slot-name">Selecione</div>
            </div>
            <div class="arrow">➜</div>
            <div class="slot" id="slot-phys" data-target="fisica">
                <div class="slot-label">3. ENERGIA</div>
                <div class="slot-icon">?</div>
                <div class="slot-name">Selecione</div>
            </div>
        </div>
        <div id="options-grid" class="options-grid"></div>
        <div class="panel-actions">
            <button id="btn-cancel" class="pixel-btn btn-red">CANCELAR</button>
            <div class="summary" id="recipe-summary">...</div>
            <button id="btn-synthesize" class="pixel-btn btn-green" disabled>SINTETIZAR</button>
        </div>
      </div>

      <div id="inspect-modal" class="hidden">
        <h2 id="inspect-name">NOME</h2>
        <div class="data-readout">
            <p id="inspect-desc">...</p>
            <div class="stats-grid">
                <div class="stat-box"><span>FOR</span><span id="val-str" class="stat-val">0</span></div>
                <div class="stat-box"><span>RES</span><span id="val-res" class="stat-val">0</span></div>
                <div class="stat-box"><span>ENE</span><span id="val-eng" class="stat-val">0</span></div>
            </div>
            <div class="terminal-log">> <span id="inspect-dialogue">...</span></div>
        </div>
      </div>

      <div id="god-menu">
          <div class="god-options">
            <div class="tool-slot" data-action="feed" title="Nutrir"><div class="tool-icon">🍖</div></div>
            <div class="tool-slot" data-action="burn" title="Incendiar"><div class="tool-icon">🔥</div></div>
            <div class="tool-slot" data-action="freeze" title="Congelar"><div class="tool-icon">❄️</div></div>
            <div class="tool-slot" data-action="mutate" title="Mutar DNA"><div class="tool-icon">🧬</div></div>
            <div class="tool-slot" data-action="kill" title="Eliminar"><div class="tool-icon">💀</div></div>
          </div>
          <div class="god-trigger">⚡</div>
      </div>

      <button id="btn-open-lab" class="pixel-btn">NOVO EXPERIMENTO</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
