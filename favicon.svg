<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HYLOMORPH">
  <title>HYLOMORPH</title>
  <defs>
    <style type="text/css"><![CDATA[
      .stroke { stroke: #000000; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round }
    ]]></style>
  </defs>

  <!-- Triângulo vermelho (esquerda) -->
  <g transform="translate(6,6)">
    <path class="stroke" d="M8 38 L28 6 L48 38 Z" fill="#FF3C3C" />
  </g>

  <!-- Quadrado azul (top-right, leve rotação) -->
  <g transform="translate(12,6) rotate(12 40 12)">
    <rect class="stroke" x="30" y="6" width="18" height="18" rx="2" ry="2" fill="#3C78FF" />
  </g>

  <!-- Círculo verde (bottom-right, overlap) -->
  <g transform="translate(10,10)">
    <circle class="stroke" cx="40" cy="36" r="10" fill="#3CFF78" />
  </g>

  <!-- Subtle pixel-ish outline to feel 90s minimal -->
  <rect x="1" y="1" width="62" height="62" rx="4" ry="4" fill="none" stroke="#001" stroke-opacity="0.06" />
</svg>